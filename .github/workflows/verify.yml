name: Verify publishing platform

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: TypeScript validation
        run: bun run lint
      - name: Publishing workflow tests
        run: bun test src/domain/workflow.test.ts src/domain/peerReview.test.ts src/domain/firebaseDiagnostics.test.ts
      - name: Production frontend build
        run: bun run build
